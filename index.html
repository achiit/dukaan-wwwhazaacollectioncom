<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAZAA COLLECTION | Elegant Pakistani Suits & Couture in Nerul East, Navi Mumbai</title>
<meta name="description" content="HAZAA COLLECTION by Heena Tabasum in Nerul East, Navi Mumbai. Discover handcrafted Pakistani 2-piece and 3-piece suits, luxury lawn prints, and intricate zari embroidery.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23221B19'/><path d='M50 15 C30 35 30 65 50 85 C70 65 70 35 50 15 Z' fill='none' stroke='%23C5A059' stroke-width='4'/><circle cx='50' cy='50' r='10' fill='%23C5A059'/></svg>">
<link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">

<style>
:root {
--bg-cream: #FAF7F2;
--bg-soft: #F3ECE1;
--surface-white: #FFFFFF;
--ink-charcoal: #201A18;
--ink-muted: #645853;
--gold-primary: #B88B4A;
--gold-dark: #8F662C;
--gold-light: #DFCA9B;
--gold-border: rgba(184, 139, 74, 0.3);
--blush-accent: #EFE4DC;
--font-display: 'Cormorant Garamond', Georgia, serif;
--font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
--transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html {
scroll-behavior: smooth;
background-color: var(--bg-cream);
color: var(--ink-charcoal);
font-family: var(--font-body);
font-size: 16px;
line-height: 1.6;
-webkit-font-smoothing: antialiased;
}
body {
overflow-x: hidden;
padding-bottom: 70px;
}
@media (min-width: 769px) {
body {
padding-bottom: 0;
}
}
img {
max-width: 100%;
height: auto;
display: block;
}
a {
text-decoration: none;
color: inherit;
}
/* Motif & Decorative Assets */
.motif-botanical {
display: inline-block;
vertical-align: middle;
color: var(--gold-primary);
}
.container {
width: 100%;
max-width: 1220px;
margin-left: auto;
margin-right: auto;
padding-left: 24px;
padding-right: 24px;
}
.section-padding {
padding-top: 90px;
padding-bottom: 90px;
}
.section-eyebrow {
font-family: var(--font-body);
font-size: 0.85rem;
text-transform: uppercase;
letter-spacing: 0.22em;
color: var(--gold-dark);
font-weight: 600;
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 12px;
}
.section-title {
font-family: var(--font-display);
font-size: clamp(2.2rem, 4vw, 3.2rem);
font-weight: 600;
line-height: 1.15;
color: var(--ink-charcoal);
margin-bottom: 18px;
}
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 10px;
padding: 13px 28px;
font-family: var(--font-body);
font-size: 0.95rem;
font-weight: 600;
border-radius: 4px;
transition: var(--transition-smooth);
cursor: pointer;
text-align: center;
letter-spacing: 0.03em;
}
.btn-gold {
background-color: var(--gold-primary);
color: #FFFFFF;
border: 1px solid var(--gold-primary);
box-shadow: 0 4px 14px rgba(184, 139, 74, 0.25);
}
.btn-gold:hover {
background-color: var(--gold-dark);
border-color: var(--gold-dark);
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(184, 139, 74, 0.35);
}
.btn-outline {
background-color: transparent;
color: var(--ink-charcoal);
border: 1px solid var(--ink-charcoal);
}
.btn-outline:hover {
background-color: var(--ink-charcoal);
color: #FFFFFF;
transform: translateY(-2px);
}
/* 1. Header */
.site-header {
position: sticky;
top: 0;
z-index: 999;
background-color: rgba(250, 247, 242, 0.96);
backdrop-filter: blur(10px);
border-bottom: 1px solid var(--gold-border);
transition: var(--transition-smooth);
}
.header-inner {
display: flex;
align-items: center;
justify-content: space-between;
height: 80px;
}
.brand-logo {
display: flex;
flex-direction: column;
}
.brand-logo-title {
font-family: var(--font-display);
font-size: 1.75rem;
font-weight: 700;
letter-spacing: 0.15em;
color: var(--ink-charcoal);
line-height: 1;
}
.brand-logo-subtitle {
font-size: 0.65rem;
letter-spacing: 0.25em;
text-transform: uppercase;
color: var(--gold-dark);
font-weight: 600;
margin-top: 4px;
}
.desktop-nav {
display: none;
align-items: center;
gap: 32px;
}
.nav-link {
font-size: 0.95rem;
font-weight: 500;
color: var(--ink-charcoal);
position: relative;
transition: color 0.2s;
}
.nav-link:hover {
color: var(--gold-dark);
}
.header-actions {
display: flex;
align-items: center;
gap: 14px;
}
.header-cta-btn {
padding: 9px 18px;
font-size: 0.88rem;
}
.hamburger-btn {
display: flex;
flex-direction: column;
justify-content: space-around;
width: 28px;
height: 22px;
background: transparent;
border: none;
cursor: pointer;
padding: 0;
}
.hamburger-btn span {
width: 100%;
height: 2px;
background-color: var(--ink-charcoal);
transition: var(--transition-smooth);
}
.mobile-menu-drawer {
display: none;
position: absolute;
top: 80px;
left: 0;
width: 100%;
background: var(--bg-cream);
border-bottom: 1px solid var(--gold-border);
padding: 24px;
box-shadow: 0 15px 30px rgba(0,0,0,0.08);
}
.mobile-menu-drawer.is-active {
display: block;
}
.mobile-nav-links {
display: flex;
flex-direction: column;
gap: 18px;
margin-bottom: 24px;
}
.mobile-nav-links a {
font-family: var(--font-display);
font-size: 1.35rem;
font-weight: 600;
color: var(--ink-charcoal);
}
@media (min-width: 992px) {
.desktop-nav {
display: flex;
}
.hamburger-btn {
display: none;
}
}
/* 2. Hero Section */
.hero-section {
position: relative;
padding-top: 60px;
padding-bottom: 90px;
background: radial-gradient(circle at 10% 20%, rgba(243, 236, 225, 0.8) 0%, transparent 60%);
}
.hero-grid {
display: grid;
grid-template-columns: 1fr;
gap: 48px;
align-items: center;
}
.hero-content {
max-width: 620px;
}
.hero-eyebrow {
display: inline-flex;
align-items: center;
gap: 8px;
background: rgba(184, 139, 74, 0.12);
padding: 6px 14px;
border-radius: 40px;
font-size: 0.8rem;
letter-spacing: 0.15em;
text-transform: uppercase;
font-weight: 600;
color: var(--gold-dark);
margin-bottom: 24px;
}
.hero-title {
font-family: var(--font-display);
font-size: clamp(2.5rem, 5.2vw, 4.2rem);
font-weight: 600;
line-height: 1.1;
margin-bottom: 22px;
color: var(--ink-charcoal);
}
.hero-title em {
font-style: italic;
color: var(--gold-primary);
font-weight: 400;
}
.hero-desc {
font-size: 1.125rem;
color: var(--ink-muted);
line-height: 1.65;
margin-bottom: 24px;
}
.hero-proof {
display: flex;
align-items: center;
gap: 12px;
font-size: 0.92rem;
color: var(--ink-charcoal);
font-weight: 500;
margin-bottom: 34px;
padding-left: 14px;
border-left: 2px solid var(--gold-primary);
}
.hero-ctas {
display: flex;
flex-wrap: wrap;
gap: 16px;
}
.hero-visual-wrapper {
position: relative;
}
.hero-image-frame {
position: relative;
border-radius: 6px;
overflow: hidden;
border: 8px solid #FFFFFF;
box-shadow: 0 25px 50px -12px rgba(32, 26, 24, 0.15);
background-color: var(--bg-soft);
aspect-ratio: 4/5;
}
.hero-image-frame img {
width: 100%;
height: 100%;
object-fit: cover;
}
.hero-floating-card {
position: absolute;
bottom: -24px;
left: -20px;
background: #FFFFFF;
padding: 16px 22px;
border-radius: 4px;
border: 1px solid var(--gold-border);
box-shadow: 0 15px 30px rgba(0,0,0,0.08);
max-width: 240px;
display: flex;
align-items: center;
gap: 14px;
}
.floating-card-icon {
width: 42px;
height: 42px;
background: var(--bg-soft);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
color: var(--gold-primary);
}
@media (min-width: 992px) {
.hero-grid {
grid-template-columns: 1.15fr 0.85fr;
}
}
/* 3. Trust Strip */
.trust-strip {
background-color: var(--ink-charcoal);
color: #FAF7F2;
padding: 50px 0;
border-top: 1px solid var(--gold-primary);
border-bottom: 1px solid var(--gold-primary);
}
.trust-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 28px;
}
.trust-item {
text-align: center;
padding: 12px;
}
.trust-num {
font-family: var(--font-display);
font-size: clamp(2.4rem, 4vw, 3.4rem);
font-weight: 700;
color: var(--gold-light);
line-height: 1;
margin-bottom: 6px;
}
.trust-label {
font-size: 0.88rem;
letter-spacing: 0.08em;
text-transform: uppercase;
color: rgba(250, 247, 242, 0.8);
font-weight: 500;
}
@media (min-width: 768px) {
.trust-grid {
grid-template-columns: repeat(4, 1fr);
}
}
/* 4. Services Section */
.services-section {
background-color: var(--bg-cream);
}
.section-header-block {
display: flex;
flex-direction: column;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 50px;
}
.services-grid {
display: grid;
grid-template-columns: 1fr;
gap: 28px;
}
.service-card {
background-color: #FFFFFF;
border: 1px solid rgba(184, 139, 74, 0.22);
border-radius: 6px;
padding: 32px 28px;
display: flex;
flex-direction: column;
justify-content: space-between;
transition: var(--transition-smooth);
position: relative;
}
.service-card:hover {
transform: translateY(-5px);
box-shadow: 0 16px 36px rgba(32, 26, 24, 0.07);
border-color: var(--gold-primary);
}
.service-icon-wrap {
width: 52px;
height: 52px;
background: var(--bg-soft);
border-radius: 4px;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 22px;
color: var(--gold-dark);
}
.service-title {
font-family: var(--font-display);
font-size: 1.55rem;
font-weight: 600;
margin-bottom: 12px;
color: var(--ink-charcoal);
}
.service-desc {
font-size: 0.95rem;
color: var(--ink-muted);
line-height: 1.6;
margin-bottom: 24px;
flex-grow: 1;
}
.service-footer {
border-top: 1px dashed var(--gold-border);
padding-top: 18px;
display: flex;
align-items: center;
justify-content: space-between;
}
.service-price {
font-size: 0.95rem;
font-weight: 700;
color: var(--ink-charcoal);
}
.service-cta-btn {
font-size: 0.85rem;
color: var(--gold-dark);
font-weight: 600;
display: inline-flex;
align-items: center;
gap: 6px;
}
.service-cta-btn:hover {
color: var(--ink-charcoal);
text-decoration: underline;
}
@media (min-width: 600px) {
.services-grid {
grid-template-columns: repeat(2, 1fr);
}
}
@media (min-width: 1024px) {
.services-grid {
grid-template-columns: repeat(3, 1fr);
}
}
/* 5. About Section */
.about-section {
background-color: var(--bg-soft);
position: relative;
}
.about-grid {
display: grid;
grid-template-columns: 1fr;
gap: 50px;
align-items: center;
}
.about-profile-card {
background: #FFFFFF;
padding: 36px 30px;
border-radius: 6px;
border: 1px solid var(--gold-border);
box-shadow: 0 15px 35px rgba(0,0,0,0.04);
text-align: center;
}
.owner-initials-avatar {
width: 110px;
height: 110px;
margin: 0 auto 20px;
background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
color: #FFFFFF;
font-family: var(--font-display);
font-size: 2.6rem;
font-weight: 700;
border: 4px solid #FFFFFF;
box-shadow: 0 6px 18px rgba(184, 139, 74, 0.3);
}
.about-author-name {
font-family: var(--font-display);
font-size: 1.7rem;
font-weight: 600;
color: var(--ink-charcoal);
}
.about-author-title {
font-size: 0.85rem;
text-transform: uppercase;
letter-spacing: 0.15em;
color: var(--gold-dark);
font-weight: 600;
margin-bottom: 16px;
}
.about-text p {
font-size: 1.05rem;
color: var(--ink-muted);
line-height: 1.75;
margin-bottom: 18px;
}
.differentiators-list {
display: grid;
grid-template-columns: 1fr;
gap: 14px;
margin-top: 28px;
}
.diff-item {
display: flex;
align-items: flex-start;
gap: 12px;
font-size: 0.95rem;
font-weight: 500;
color: var(--ink-charcoal);
}
.diff-bullet {
color: var(--gold-primary);
flex-shrink: 0;
margin-top: 3px;
}
@media (min-width: 820px) {
.about-grid {
grid-template-columns: 0.85fr 1.15fr;
}
.differentiators-list {
grid-template-columns: repeat(2, 1fr);
}
}
/* 6. Gallery Section (Asymmetric / Varied Grid) */
.gallery-section {
background-color: var(--bg-cream);
}
.gallery-grid {
display: grid;
grid-template-columns: 1fr;
gap: 18px;
}
.gallery-item {
position: relative;
overflow: hidden;
border-radius: 4px;
background-color: var(--bg-soft);
box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}
.gallery-item img {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}
.gallery-item:hover img {
transform: scale(1.05);
}
.gallery-caption {
position: absolute;
bottom: 0;
left: 0;
right: 0;
padding: 20px;
background: linear-gradient(to top, rgba(32, 26, 24, 0.85) 0%, transparent 100%);
color: #FFFFFF;
font-family: var(--font-display);
font-size: 1.25rem;
font-weight: 500;
opacity: 0;
transform: translateY(10px);
transition: var(--transition-smooth);
}
.gallery-item:hover .gallery-caption {
opacity: 1;
transform: translateY(0);
}
@media (min-width: 600px) {
.gallery-grid {
grid-template-columns: repeat(2, 1fr);
}
}
@media (min-width: 900px) {
.gallery-grid {
grid-template-columns: repeat(12, 1fr);
grid-auto-rows: 240px;
}
.gallery-item:nth-child(1) { grid-column: span 5; grid-row: span 2; }
.gallery-item:nth-child(2) { grid-column: span 4; grid-row: span 1; }
.gallery-item:nth-child(3) { grid-column: span 3; grid-row: span 1; }
.gallery-item:nth-child(4) { grid-column: span 4; grid-row: span 2; }
.gallery-item:nth-child(5) { grid-column: span 3; grid-row: span 1; }
.gallery-item:nth-child(6) { grid-column: span 5; grid-row: span 1; }
.gallery-item:nth-child(7) { grid-column: span 4; grid-row: span 1; }
.gallery-item:nth-child(8) { grid-column: span 4; grid-row: span 1; }
}
/* 7. Testimonials */
.testimonials-section {
background-color: var(--blush-accent);
}
.testimonials-grid {
display: grid;
grid-template-columns: 1fr;
gap: 28px;
}
.testimonial-card {
background: #FFFFFF;
border: 1px solid var(--gold-border);
border-radius: 6px;
padding: 34px 28px;
box-shadow: 0 10px 25px rgba(0,0,0,0.03);
display: flex;
flex-direction: column;
justify-content: space-between;
}
.testimonial-stars {
display: flex;
gap: 4px;
color: var(--gold-primary);
margin-bottom: 18px;
}
.testimonial-quote {
font-size: 1rem;
font-style: italic;
line-height: 1.7;
color: var(--ink-charcoal);
margin-bottom: 22px;
}
.testimonial-client {
font-weight: 700;
color: var(--ink-charcoal);
font-size: 1rem;
}
.testimonial-locality {
font-size: 0.85rem;
color: var(--gold-dark);
font-weight: 500;
}
@media (min-width: 768px) {
.testimonials-grid {
grid-template-columns: repeat(3, 1fr);
}
}
/* 8. Pricing Section (Clean transparent list) */
.pricing-section {
background-color: var(--bg-cream);
}
.pricing-table-container {
max-width: 860px;
margin: 0 auto;
background: #FFFFFF;
border: 1px solid var(--gold-border);
border-radius: 6px;
box-shadow: 0 10px 30px rgba(0,0,0,0.04);
overflow: hidden;
}
.pricing-header {
padding: 24px 32px;
background-color: var(--bg-soft);
border-bottom: 1px solid var(--gold-border);
display: flex;
justify-content: space-between;
align-items: center;
}
.pricing-header span {
font-weight: 700;
text-transform: uppercase;
font-size: 0.85rem;
letter-spacing: 0.12em;
color: var(--gold-dark);
}
.pricing-list-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 32px;
border-bottom: 1px solid rgba(184, 139, 74, 0.15);
transition: background-color 0.2s;
}
.pricing-list-item:last-child {
border-bottom: none;
}
.pricing-list-item:hover {
background-color: rgba(243, 236, 225, 0.4);
}
.pricing-item-name {
font-family: var(--font-display);
font-size: 1.25rem;
font-weight: 600;
color: var(--ink-charcoal);
}
.pricing-item-sub {
font-size: 0.85rem;
color: var(--ink-muted);
margin-top: 2px;
}
.pricing-item-value {
text-align: right;
}
.pricing-rate {
font-size: 1.15rem;
font-weight: 700;
color: var(--gold-dark);
}
.pricing-action-link {
font-size: 0.8rem;
display: block;
color: var(--ink-muted);
text-decoration: underline;
margin-top: 2px;
}
/* 9. Contact & Map */
.contact-section {
background-color: var(--bg-soft);
}
.contact-grid {
display: grid;
grid-template-columns: 1fr;
gap: 40px;
}
.contact-info-panel {
background: #FFFFFF;
padding: 40px 32px;
border-radius: 6px;
border: 1px solid var(--gold-border);
display: flex;
flex-direction: column;
justify-content: space-between;
}
.contact-item-group {
margin-bottom: 26px;
}
.contact-item-label {
font-size: 0.8rem;
text-transform: uppercase;
letter-spacing: 0.14em;
font-weight: 600;
color: var(--gold-dark);
margin-bottom: 6px;
}
.contact-item-val {
font-size: 1.05rem;
color: var(--ink-charcoal);
font-weight: 500;
line-height: 1.5;
}
.hours-two-col {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin-top: 8px;
}
.hours-pill {
background: var(--bg-cream);
padding: 10px 14px;
border-radius: 4px;
font-size: 0.9rem;
border-left: 3px solid var(--gold-primary);
}
.map-container {
width: 100%;
height: 100%;
min-height: 420px;
border-radius: 6px;
overflow: hidden;
border: 1px solid var(--gold-border);
box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}
.map-container iframe {
width: 100%;
height: 100%;
border: 0;
display: block;
}
@media (min-width: 992px) {
.contact-grid {
grid-template-columns: 1fr 1.15fr;
}
}
/* 10. Footer */
.site-footer {
background-color: var(--ink-charcoal);
color: #FAF7F2;
padding-top: 80px;
padding-bottom: 40px;
border-top: 3px solid var(--gold-primary);
}
.footer-top-grid {
display: grid;
grid-template-columns: 1fr;
gap: 40px;
margin-bottom: 60px;
}
.footer-brand-title {
font-family: var(--font-display);
font-size: 2rem;
letter-spacing: 0.1em;
color: var(--gold-light);
margin-bottom: 10px;
}
.footer-brand-desc {
font-size: 0.95rem;
color: rgba(250, 247, 242, 0.7);
line-height: 1.6;
max-width: 360px;
}
.footer-col-title {
font-family: var(--font-display);
font-size: 1.25rem;
color: #FFFFFF;
margin-bottom: 18px;
letter-spacing: 0.05em;
}
.footer-links {
list-style: none;
display: flex;
flex-direction: column;
gap: 12px;
}
.footer-links a {
color: rgba(250, 247, 242, 0.75);
font-size: 0.95rem;
transition: color 0.2s;
}
.footer-links a:hover {
color: var(--gold-light);
}
.footer-cta-box {
background: rgba(255,255,255,0.04);
border: 1px solid rgba(184, 139, 74, 0.3);
padding: 24px;
border-radius: 6px;
}
.footer-cta-box p {
